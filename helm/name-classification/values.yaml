replicaCount: 1

image:
  repository: name-classification
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: "250m"
    memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: name-classification.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

env:
  # Path inside the container where the checkpoint is stored (Dockerfile default)
  weightsPath: /app/weights.pt
