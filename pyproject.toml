[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "name-classification"
version = "1.0.0"
description = "Character RNN name-origin classification with REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0,<3",
  "numpy>=1.26,<3",
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
include = ["name_classification*"]
